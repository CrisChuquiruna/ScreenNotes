name: 'Release ScreenNotes'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin' # Apple Silicon (M1/M2/M3/M4)
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'  # Intel Mac
          - platform: 'ubuntu-22.04'
            args: ''                              # Linux (.deb, .AppImage)
          - platform: 'windows-latest'
            args: ''                              # Windows (.exe, .msi)

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Ubuntu dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Publish with Tauri Action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ScreenNotes v__VERSION__'
          releaseBody: 'Descarga ScreenNotes para Windows, macOS o Linux desde los archivos adjuntos a continuación.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
